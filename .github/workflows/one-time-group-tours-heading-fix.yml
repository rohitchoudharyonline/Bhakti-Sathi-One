name: One-time group tours heading fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace homepage group tours heading
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/traveler/GroupToursSection.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<span>Sangha Pilgrimages & Group Yatras</span>'
          new = '<span>Group Tours</span>'
          if old not in text:
              raise SystemExit('Expected heading not found; stopping without changes.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-group-tours-heading-fix.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/traveler/GroupToursSection.tsx .github/workflows/one-time-group-tours-heading-fix.yml
          git commit -m 'fix: rename homepage group tours heading'
          git push
