name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh security-pinned lockfile in CI workspace
        run: bun update qs@6.16.0 sharp@0.35.4 --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check / Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore only Tours and Destinations from 3:45 AM IST
        # This run is intentionally invoked only with the restore-345 commit marker.\n        # Target: 2026-09-24T22:15:00Z (3:45 AM IST on 25 Sep 2026).
        if: contains(github.event.head_commit.message, '[restore-345]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CURRENT_INFO="$(bunx wrangler d1 time-travel info DB --json)"
          CURRENT_BOOKMARK="$(printf '%s' "$CURRENT_INFO" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",{}).get("bookmark") or d.get("bookmark") or "")')"
          test -n "$CURRENT_BOOKMARK"
          printf 'y\n' | bunx wrangler d1 time-travel restore DB --timestamp="2026-09-24T22:15:00Z" --json
          OLD_ROWS="$(bunx wrangler d1 execute DB --remote --json --command="SELECT id, hex(CAST(structured_content AS TEXT)) AS structured_hex FROM contents WHERE id IN ('registry-packages','registry-destinations')")"
          printf '%s' "$OLD_ROWS" > /tmp/old-content.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/old-content.json'))
          rows=[]
          def walk(x):
              if isinstance(x, dict):
                  if 'id' in x and 'structured_hex' in x: rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(d)
          seen=set(); out=[]
          for r in rows:
              if r['id'] in seen: continue
              seen.add(r['id'])
              h=str(r.get('structured_hex') or '')
              if h:
                  out.append("UPDATE contents SET structured_content = CAST(X'%s' AS TEXT) WHERE id = '%s';" % (h, r['id'].replace("'","''")))
              else:
                  out.append("DELETE FROM contents WHERE id = '%s';" % r['id'].replace("'","''"))
          if set(seen) != {'registry-packages','registry-destinations'}:
              raise SystemExit('Historical restore did not contain both required registry rows')
          # The approved restore must contain all three real Holidays Hunt tours.
          package_rows = [r for r in rows if r['id'] == 'registry-packages']
          if not package_rows:
              raise SystemExit('Historical restore is missing registry-packages')
          try:
              raw = bytes.fromhex(str(package_rows[0].get('structured_hex') or '')).decode('utf-8')
              outer = json.loads(raw)
              value = outer.get('value') if isinstance(outer, dict) else None
              packages = json.loads(value) if isinstance(value, str) else value
              ids = {str(p.get('id')) for p in packages if isinstance(p, dict)}
          except Exception as exc:
              raise SystemExit(f'Could not validate historical tour registry: {exc}')
          required = {
              'pkg-1789721050903',
              'pkg-1789720939137',
              'pkg-1789411062209',
          }
          if not required.issubset(ids):
              raise SystemExit(f'Historical 3:45 tour registry is missing approved tours: {sorted(required - ids)}')
          out.append("UPDATE contents SET status = 'published' WHERE id IN ('registry-packages','registry-destinations');")
          open('/tmp/restore-selected.sql','w').write('\n'.join(out)+'\n')
          PY
          printf 'y\n' | bunx wrangler d1 time-travel restore DB --bookmark="$CURRENT_BOOKMARK" --json
          bunx wrangler d1 execute DB --remote --file=/tmp/restore-selected.sql --yes
          bunx wrangler d1 execute DB --remote --command="SELECT id, length(structured_content) AS content_length FROM contents WHERE id IN ('registry-packages','registry-destinations')"

      - name: Restore exact 4:00 AM IST D1 state
        if: contains(github.event.head_commit.message, '[restore-4am]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf 'y\n' | bunx wrangler d1 time-travel restore DB --timestamp="2026-09-24T22:29:59Z" --json

      - name: Deploy Worker and Static Assets
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
