name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh security-pinned lockfile in CI workspace
        run: bun update qs@6.16.0 sharp@0.35.4 --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit

      - name: Type check / lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify privileged configuration is absent from browser bundle
        run: |
          if grep -R -n -E 'r2_prod_key_77a9|d1_token_bhaktisathi_prod_882|a9e18b43f76902cd98ef11' dist --exclude='*.map'; then
            echo 'ERROR: privileged infrastructure configuration leaked into dist.'
            exit 1
          fi
          echo 'Browser bundle does not contain the blocked infrastructure values.'
