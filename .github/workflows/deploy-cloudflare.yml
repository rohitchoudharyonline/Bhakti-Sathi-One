name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh security-pinned lockfile in CI workspace
        run: bun update qs@6.16.0 sharp@0.35.4 --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check / Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore exact 7:59 AM IST D1 state
        if: contains(github.event.head_commit.message, '[restore-759]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf 'y\n' | bunx wrangler d1 time-travel restore DB --timestamp="2026-09-25T02:29:59Z" --json

      - name: Verify restored tour data
        if: contains(github.event.head_commit.message, '[restore-759]')
        run: |
          curl -sS --max-time 20 "https://holidayshunt.com/api/contents?type=shared_local_state&_nocache=$(date +%s)" | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("data",[]); r=next((x for x in rows if x.get("id")=="registry-packages"),None); v=((r or {}).get("structured_content") or {}).get("value","") if isinstance((r or {}).get("structured_content"),dict) else ""; a=json.loads(v) if v else []; print("TOUR COUNT:",len(a)); [print(x.get("id"),"|",x.get("title"),"| price=",x.get("price"),"| discounted=",x.get("discountedPrice")) for x in a]'

      - name: Deploy Worker and Static Assets
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
