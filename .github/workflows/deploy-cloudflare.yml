name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh security-pinned lockfile in CI workspace
        run: bun update qs@6.16.0 sharp@0.35.4 --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check / Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: STRICT one-time restore to pre-8am D1 snapshot
        run: |
          bunx wrangler d1 time-travel restore DB --timestamp="2026-09-25T02:29:59Z" --json
          bunx wrangler d1 execute DB --remote --command "SELECT id, json_array_length(json_extract(structured_content, '$.value')) AS item_count FROM contents WHERE id IN ('registry-packages','registry-destinations');"
          bunx wrangler d1 execute DB --remote --command "SELECT json_extract(value,'$.id') AS id, json_extract(value,'$.title') AS title, json_extract(value,'$.slug') AS slug FROM contents, json_each(json_extract(structured_content,'$.value')) WHERE contents.id='registry-packages';"
          bunx wrangler d1 execute DB --remote --command "SELECT json_extract(value,'$.slug') AS slug, json_extract(value,'$.name') AS name FROM contents, json_each(json_extract(structured_content,'$.value')) WHERE contents.id='registry-destinations';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and Static Assets
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
